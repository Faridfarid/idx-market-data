name: fetch-telkom-fs
on:
  push:
    branches: [fetch-telkom-fs]
permissions:
  contents: write
jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download PDF
        run: |
          mkdir -p out
          curl -fL --retry 3 -A "Mozilla/5.0" -o out/Telkom-FS-Unaudited-3Q-2026.pdf \
            "https://aro.telkom.co.id/minio/show/data/lampiran/1793379510627_original_Financial-Statements-Unaudited-3Q-2026.pdf"
          file out/*.pdf; ls -l out
      - name: Commit to temp branch
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add out && git commit -m "temp: Telkom FS 3Q 2026" && git push
